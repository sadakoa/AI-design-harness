<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
  .wrap { max-width: 720px; margin: 32px auto; background: #fff; padding: 24px; border-radius: 6px; }
  h1 { font-size: 22px; color: #222; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #e5e5e5; }
  .toggle { width: 40px; height: 22px; border-radius: 11px; background: #ccc; position: relative; cursor: pointer; }
  .toggle.on { background: #2ecc71; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .toggle.on::after { left: 20px; }
  .hint { font-size: 12px; color: #999; }
  .actions { display: flex; gap: 8px; margin-top: 24px; }
  .btn { padding: 8px 16px; border-radius: 4px; border: 0; color: #fff; background: var(--color-action-primary); cursor: pointer; }
  .btn.danger { background: #e74c3c; }
  select { padding: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Notification Settings</h1>
  <div class="row"><div>Enable notifs for new tickets<div class="hint">get pinged on every new ticket</div></div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
  <div class="row"><div>Ticket assigned to me</div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
  <div class="row"><div>SLA breach alerts</div><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
  <div class="row"><div>Digest frequency</div><select><option>Realtime</option><option>Hourly</option><option>Daily</option></select></div>
  <div class="row"><div>Sound</div><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
  <div class="actions">
    <button class="btn" onclick="alert('Saved!')">Save</button>
    <button class="btn" onclick="history.back()">Cancel</button>
    <button class="btn danger" onclick="localStorage.clear(); alert('All settings reset')">Reset all</button>
  </div>
</div>
</body>
</html>
