<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The five planes of user experience, from surface at the top to strategy at the bottom. Surface and skeleton come from your code through npm run sync. Structure has no other home, so it's written in the harness. Scope and strategy live in docs elsewhere; the harness links to them and keeps only the parts designs cite.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .head { font-size: 13px; font-weight: 600; fill: #57606A; }
    .title { font-size: 16px; font-weight: 600; fill: #1F2328; }
    .num { font-size: 13px; fill: #57606A; }
    .desc { font-size: 12.5px; fill: #57606A; }
    .text { font-size: 13.5px; fill: #1F2328; }
    .file { font-size: 13px; fill: #1F2328; }
    .code { font-size: 12.5px; fill: #3B5BDB; }
    .accent { font-size: 13px; font-weight: 600; fill: #3B5BDB; }
    .ext { fill: #FFFFFF; stroke: #D8DEE4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .sep { stroke: #D8DEE4; stroke-width: 1; }
    .line { fill: none; stroke: #57606A; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
  </style>

  <rect x="0" y="0" width="960" height="540" rx="16" fill="#FAFAF7"/>

  <!-- Column heads -->
  <text class="sans head" x="20" y="44">Plane</text>
  <text class="sans head" x="150" y="44">Usually lives in</text>
  <text class="sans head" x="421" y="44" text-anchor="middle">Gets in by</text>
  <text class="mono head" x="510" y="44">product/</text>
  <text class="mono head" x="730" y="44">design-system/</text>

  <!-- Structure: the plane the harness is the home for -->
  <rect x="10" y="252" width="940" height="92" rx="10" fill="#EEF2FF"/>

  <g class="sep">
    <line x1="10" y1="160" x2="950" y2="160"/>
    <line x1="10" y1="252" x2="950" y2="252"/>
    <line x1="10" y1="344" x2="950" y2="344"/>
    <line x1="10" y1="436" x2="950" y2="436"/>
  </g>

  <!-- 5 Surface -->
  <text class="sans num" x="20" y="106">5</text><text class="sans title" x="36" y="106">Surface</text>
  <text class="sans desc" x="20" y="128">the look</text>
  <rect class="ext" x="150" y="80" width="190" height="68" rx="10"/>
  <text class="sans text" x="164" y="108">Your code</text>
  <text class="sans desc" x="164" y="130">CSS variables, Figma</text>
  <line class="line" x1="352" y1="114" x2="490" y2="114" marker-end="url(#arrow)"/>
  <text class="mono code" x="421" y="104" text-anchor="middle">npm run sync</text>
  <text class="sans desc" x="421" y="134" text-anchor="middle">one way, automatic</text>
  <text class="sans desc" x="510" y="108">—</text>
  <text class="mono file" x="730" y="108">tokens/</text>
  <text class="mono file" x="730" y="130">screens/</text>

  <!-- 4 Skeleton -->
  <text class="sans num" x="20" y="198">4</text><text class="sans title" x="36" y="198">Skeleton</text>
  <text class="sans desc" x="20" y="220">parts and layout</text>
  <rect class="ext" x="150" y="172" width="190" height="68" rx="10"/>
  <text class="sans text" x="164" y="200">Your code</text>
  <text class="sans desc" x="164" y="222">components, Figma library</text>
  <line class="line" x1="352" y1="206" x2="490" y2="206" marker-end="url(#arrow)"/>
  <text class="mono code" x="421" y="196" text-anchor="middle">npm run sync</text>
  <text class="sans desc" x="421" y="226" text-anchor="middle">+ written here</text>
  <text class="sans desc" x="510" y="200">—</text>
  <text class="mono file" x="730" y="186">components/</text>
  <text class="mono file" x="730" y="206">foundations/writing.md</text>
  <text class="mono file" x="730" y="226">foundations/rules.md</text>

  <!-- 3 Structure -->
  <text class="sans num" x="20" y="290">3</text><text class="sans title" x="36" y="290">Structure</text>
  <text class="sans desc" x="20" y="312">how it's organized</text>
  <rect class="ext" x="150" y="264" width="190" height="68" rx="10"/>
  <text class="sans desc" x="164" y="292">Rarely written down</text>
  <text class="sans desc" x="164" y="314">Figma flows, or nowhere</text>
  <text class="sans accent" x="421" y="294" text-anchor="middle">written here</text>
  <text class="sans desc" x="421" y="314" text-anchor="middle">no other home</text>
  <text class="mono file" x="510" y="292">concepts.md</text>
  <text class="mono file" x="510" y="314">structure.md</text>
  <text class="mono file" x="730" y="292">patterns/</text>

  <!-- 2 Scope -->
  <text class="sans num" x="20" y="382">2</text><text class="sans title" x="36" y="382">Scope</text>
  <text class="sans desc" x="20" y="404">what we build</text>
  <rect class="ext" x="150" y="356" width="190" height="68" rx="10"/>
  <text class="sans text" x="164" y="384">PRDs, specs, tickets</text>
  <text class="sans desc" x="164" y="406">Notion, Jira and the like</text>
  <line class="line dash" x1="352" y1="390" x2="490" y2="390" marker-end="url(#arrow)"/>
  <text class="sans desc" x="421" y="380" text-anchor="middle">linked</text>
  <text class="sans desc" x="421" y="410" text-anchor="middle">PRD copied per feature</text>
  <text class="mono file" x="510" y="376">constraints.md</text>
  <text class="mono file" x="510" y="396">decisions.md, sources.md</text>
  <text class="sans desc" x="510" y="416">(these two cover strategy too)</text>
  <text class="sans desc" x="730" y="384">—</text>

  <!-- 1 Strategy -->
  <text class="sans num" x="20" y="474">1</text><text class="sans title" x="36" y="474">Strategy</text>
  <text class="sans desc" x="20" y="496">why, and for whom</text>
  <rect class="ext" x="150" y="448" width="190" height="68" rx="10"/>
  <text class="sans text" x="164" y="476">Plans, OKRs, research</text>
  <text class="sans desc" x="164" y="498">interviews, roadmaps</text>
  <line class="line dash" x1="352" y1="482" x2="490" y2="482" marker-end="url(#arrow)"/>
  <text class="sans desc" x="421" y="472" text-anchor="middle">linked</text>
  <text class="sans desc" x="421" y="502" text-anchor="middle">cited parts kept here</text>
  <text class="mono file" x="510" y="476">users.md, jobs.md</text>
  <text class="mono file" x="510" y="498">principles.md</text>
  <text class="sans desc" x="730" y="476">—</text>
</svg>
