<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="A feedback entry starts open; a person decides whether it is adopted, local or dropped">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .status { font-size: 18px; font-weight: 600; fill: #1F2328; }
    .text { font-size: 15px; fill: #57606A; }
    .card { fill: #FFFFFF; stroke: #D8DEE4; stroke-width: 1.5; }
    .line { fill: none; stroke: #57606A; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="960" height="300" rx="16" fill="#FAFAF7"/>

  <!-- open -->
  <rect x="40" y="108" width="200" height="84" rx="12" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="2"/>
  <text class="mono status" x="140" y="146" text-anchor="middle">open</text>
  <text class="sans text" x="140" y="172" text-anchor="middle">a new finding</text>
  <text class="sans text" x="140" y="226" text-anchor="middle">A person decides</text>

  <!-- outcomes -->
  <rect class="card" x="420" y="28" width="500" height="72" rx="12"/>
  <text class="mono status" x="444" y="70">adopted</text>
  <text class="sans text" x="556" y="70">The design system changes. Logged as D-xx.</text>

  <rect class="card" x="420" y="114" width="500" height="72" rx="12"/>
  <text class="mono status" x="444" y="156">local</text>
  <text class="sans text" x="556" y="156">Stays a decision for that one screen.</text>

  <rect class="card" x="420" y="200" width="500" height="72" rx="12"/>
  <text class="mono status" x="444" y="242">dropped</text>
  <text class="sans text" x="556" y="242">The row stays, with the reason.</text>

  <!-- bus -->
  <line class="line" x1="240" y1="150" x2="320" y2="150"/>
  <line class="line" x1="320" y1="64" x2="320" y2="236"/>
  <line class="line" x1="320" y1="64" x2="416" y2="64" marker-end="url(#arrow)"/>
  <line class="line" x1="320" y1="150" x2="416" y2="150" marker-end="url(#arrow)"/>
  <line class="line" x1="320" y1="236" x2="416" y2="236" marker-end="url(#arrow)"/>
</svg>
