<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Building reads to explore several options; reviewing checks one area at a time and narrows to findings">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 22px; font-weight: 600; fill: #1F2328; }
    .sub { font-size: 14px; fill: #57606A; }
    .node { fill: #FFFFFF; stroke: #D8DEE4; stroke-width: 1.5; }
    .nodeText { font-size: 15px; fill: #1F2328; }
    .small { font-size: 13px; font-weight: 600; fill: #1F2328; letter-spacing: 0.06em; }
    .chip { fill: #EEF2FF; }
    .chipText { font-size: 14px; fill: #1F2328; }
    .lens { font-size: 15px; font-weight: 600; fill: #1F2328; }
    .files { font-size: 14px; fill: #57606A; }
    .line { fill: none; stroke: #57606A; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="960" height="500" rx="16" fill="#FAFAF7"/>

  <!-- Build panel -->
  <rect x="24" y="24" width="444" height="452" rx="14" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.5"/>
  <text class="sans h" x="52" y="70">Build</text>
  <text class="sans sub" x="52" y="94">Open up: one PRD, several real options</text>

  <rect class="node" x="52" y="160" width="90" height="44" rx="10" style="fill:#EEF2FF;stroke:#3B5BDB"/>
  <text class="sans nodeText" x="97" y="187" text-anchor="middle">PRD</text>
  <rect class="node" x="330" y="118" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="385" y="141" text-anchor="middle">Option A</text>
  <rect class="node" x="330" y="165" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="385" y="188" text-anchor="middle">Option B</text>
  <rect class="node" x="330" y="212" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="385" y="235" text-anchor="middle">Option C</text>
  <line class="line" x1="142" y1="182" x2="326" y2="136" marker-end="url(#arrow)"/>
  <line class="line" x1="142" y1="182" x2="326" y2="183" marker-end="url(#arrow)"/>
  <line class="line" x1="142" y1="182" x2="326" y2="230" marker-end="url(#arrow)"/>

  <text class="sans small" x="52" y="290">READS</text>
  <rect class="chip" x="52" y="304" width="104" height="30" rx="15"/>
  <text class="mono chipText" x="104" y="324" text-anchor="middle">principles</text>
  <rect class="chip" x="164" y="304" width="62" height="30" rx="15"/>
  <text class="mono chipText" x="195" y="324" text-anchor="middle">rules</text>
  <rect class="chip" x="234" y="304" width="80" height="30" rx="15"/>
  <text class="mono chipText" x="274" y="324" text-anchor="middle">writing</text>
  <rect class="chip" x="322" y="304" width="88" height="30" rx="15"/>
  <text class="mono chipText" x="366" y="324" text-anchor="middle">patterns</text>
  <rect class="chip" x="52" y="344" width="104" height="30" rx="15"/>
  <text class="mono chipText" x="104" y="364" text-anchor="middle">tokens.css</text>
  <rect class="chip" x="164" y="344" width="80" height="30" rx="15"/>
  <text class="mono chipText" x="204" y="364" text-anchor="middle">screens</text>
  <text class="sans sub" x="52" y="414">when needed</text>
  <rect x="148" y="394" width="110" height="30" rx="15" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.5"/>
  <text class="mono chipText" x="203" y="414" text-anchor="middle">components</text>

  <!-- Review panel -->
  <rect x="492" y="24" width="444" height="452" rx="14" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.5"/>
  <text class="sans h" x="520" y="70">Review</text>
  <text class="sans sub" x="520" y="94">Narrow down: one area at a time</text>

  <rect class="node" x="520" y="118" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="575" y="141" text-anchor="middle">Components</text>
  <rect class="node" x="520" y="165" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="575" y="188" text-anchor="middle">Layout</text>
  <rect class="node" x="520" y="212" width="110" height="36" rx="8"/>
  <text class="sans nodeText" x="575" y="235" text-anchor="middle">Copy</text>
  <rect class="node" x="800" y="160" width="110" height="44" rx="10" style="fill:#EEF2FF;stroke:#3B5BDB"/>
  <text class="sans nodeText" x="855" y="187" text-anchor="middle">Findings</text>
  <line class="line" x1="630" y1="136" x2="796" y2="180" marker-end="url(#arrow)"/>
  <line class="line" x1="630" y1="183" x2="796" y2="182" marker-end="url(#arrow)"/>
  <line class="line" x1="630" y1="230" x2="796" y2="184" marker-end="url(#arrow)"/>

  <text class="sans small" x="520" y="290">READS, PER AREA</text>
  <text class="sans lens" x="520" y="322">Components</text>
  <text class="mono files" x="520" y="344">principles · rules · components · tokens.css</text>
  <text class="sans lens" x="520" y="382">Layout</text>
  <text class="mono files" x="520" y="404">principles · rules · patterns</text>
  <text class="sans lens" x="520" y="442">Copy</text>
  <text class="mono files" x="520" y="464">rules · writing</text>
</svg>
